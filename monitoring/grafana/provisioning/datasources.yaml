apiVersion: 1
prune: true
datasources:
  - name: Prometheus
    uid: mecaniqa-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.mecaniqa.svc.cluster.local:9090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 15s
