
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mecaniqa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: mecaniqa
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: mecaniqa
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mecaniqa
roleRef:
  kind: Role
  name: prometheus-discovery
  apiGroup: rbac.authorization.k8s.io

