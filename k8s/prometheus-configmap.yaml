apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mecaniqa
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 5s
    scrape_configs:
      - job_name: iot-simulator
        metrics_path: /metrics
        static_configs:
          - targets: ["iot-simulator:8000"]
