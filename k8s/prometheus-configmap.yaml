apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mecaniqa
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 5s
    scrape_configs:
      - job_name: iot-simulator
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - mecaniqa
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: iot-simulator
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
        metrics_path: /metrics
